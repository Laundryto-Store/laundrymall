name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Build Next.js App
      run: npm run build
      env:
        # Ignore TypeScript errors in CI if we have any lingering from prototyping
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: "https://backend-production-3a66.up.railway.app"
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: "pk_bc3432542b3168216839bbb59a558c5b4077cc11fda3ba1c285fd73c4a797c54"
    - name: Start Next.js server in background
      run: npm run start &
      env:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: "https://backend-production-3a66.up.railway.app"
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: "pk_bc3432542b3168216839bbb59a558c5b4077cc11fda3ba1c285fd73c4a797c54"
    - name: Wait for server to be ready
      run: npx wait-on http://localhost:3000
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
